<!doctype html>
<!--
  Écran hors ligne.

  Servi par l'agent de service (`/sw.js`) quand une navigation échoue faute de
  réseau. C'est un fichier **statique**, et il doit le rester : une route Next
  demanderait au serveur de la rendre, c'est-à-dire précisément la chose qui
  n'est pas joignable au moment où l'on en a besoin.

  Aucun style externe, aucune police distante, aucune image autre que l'icône
  déjà mise en cache à l'installation : tout ce qui n'est pas dans ce fichier
  ou dans le cache ne s'afficherait pas.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071c2c" />
    <title>Hors ligne — One Piece Quest</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem 1.5rem;
        box-sizing: border-box;
        text-align: center;
        background: radial-gradient(circle at 50% 0%, #0e3045 0%, #071c2c 70%);
        color: #f5e8c8;
        font-family: Georgia, 'Times New Roman', serif;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 22%;
      }
      h1 {
        margin: 0;
        font-size: 1.6rem;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        max-width: 34ch;
        line-height: 1.6;
        opacity: 0.85;
        font-size: 1rem;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.8rem 1.9rem;
        border: 0;
        border-radius: 10px;
        background: #f4c84a;
        color: #071c2c;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #f58a32;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" />
    <h1 data-fr="Le Log Pose ne répond plus" data-en="The Log Pose has gone quiet">Le Log Pose ne répond plus</h1>
    <p
      data-fr="Aucune connexion réseau. Le jeu a besoin du serveur pour lire ton équipage et le classement de la semaine — reconnecte-toi au réseau, puis réessaie."
      data-en="No network connection. The game needs the server to read your crew and this week’s leaderboard — reconnect, then try again."
    >
      Aucune connexion réseau. Le jeu a besoin du serveur pour lire ton
      équipage et le classement de la semaine — reconnecte-toi au réseau, puis
      réessaie.
    </p>
    <button type="button" onclick="location.reload()" data-fr="Réessayer" data-en="Try again">Réessayer</button>
    <script>
      // La langue vient du même cookie que le reste du jeu (`opq_display`,
      // lisible par le navigateur). Sans cookie, ou sans script : français.
      (function () {
        var m = /(?:^|;\s*)opq_display=([a-z]{2})/.exec(document.cookie);
        var lang = m && m[1] === 'en' ? 'en' : 'fr';
        if (lang === 'fr') return;
        document.documentElement.lang = lang;
        document.title = 'Offline — One Piece Quest';
        var nodes = document.querySelectorAll('[data-en]');
        for (var i = 0; i < nodes.length; i++) nodes[i].textContent = nodes[i].getAttribute('data-en');
      })();
    </script>
  </body>
</html>
